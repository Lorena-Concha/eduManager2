<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Detalle de estudiante - SpringEduManager (demo)</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="demo-banner-placeholder"></div>
<div id="nav-placeholder"></div>

<div class="container">
    <nav class="breadcrumb">
        <a href="dashboard.html">Inicio</a><span class="sep">/</span>
        <a href="estudiantes.html">Estudiantes</a><span class="sep">/</span>
        <span class="current" id="breadcrumb-nombre"></span>
    </nav>
    <h1 id="titulo"></h1>
    <p class="muted" id="email"></p>
    <span class="badge badge-user" id="badge-estado"></span>

    <div class="card">
        <h2>Datos personales</h2>
        <table>
            <tbody id="tbody-datos"></tbody>
        </table>
    </div>

    <div class="card">
        <h2>Cursos inscritos</h2>
        <ul id="lista-cursos"></ul>
        <p class="muted" id="sin-cursos" hidden>Sin cursos inscritos aun.</p>
    </div>

    <div class="card">
        <h2>Evaluaciones</h2>
        <table id="tabla-evaluaciones">
            <thead><tr><th>Curso</th><th>Nota</th><th>Fecha</th><th>Comentario</th></tr></thead>
            <tbody></tbody>
        </table>
        <p class="muted" id="sin-evaluaciones" hidden>Sin evaluaciones registradas.</p>
    </div>

    <a href="estudiantes.html" class="btn btn-secondary">&larr; Volver</a>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
    EduAuth.requireLogin();
    if (!EduAuth.isAdmin()) { window.location.href = 'dashboard.html'; }
    EduNav.renderDemoBanner();
    EduNav.render();

    const params = new URLSearchParams(location.search);
    const id = Number(params.get('id'));
    const cursos = EduData.getCursos();
    const estudiante = EduData.getEstudiantes().find(function (e) { return e.id === id; });

    if (!estudiante) {
        window.location.href = '404.html';
    } else {
        const nombreCompleto = estudiante.nombre + ' ' + estudiante.apellido;
        document.getElementById('titulo').textContent = nombreCompleto;
        document.getElementById('breadcrumb-nombre').textContent = nombreCompleto;
        document.getElementById('email').textContent = estudiante.email;
        document.getElementById('badge-estado').textContent = estudiante.estado;

        document.getElementById('tbody-datos').innerHTML =
            '<tr><th>RUT</th><td>' + estudiante.rut + '</td></tr>' +
            '<tr><th>Telefono</th><td>' + estudiante.telefono + '</td></tr>' +
            '<tr><th>Fecha de nacimiento</th><td>' + estudiante.fechaNacimiento + '</td></tr>' +
            '<tr><th>Direccion</th><td>' + estudiante.direccion + '</td></tr>' +
            '<tr><th>Ciudad</th><td>' + estudiante.ciudad + '</td></tr>' +
            '<tr><th>Fecha de ingreso</th><td>' + estudiante.fechaIngreso + '</td></tr>' +
            '<tr><th>Genero</th><td>' + estudiante.genero + '</td></tr>' +
            '<tr><th>Observaciones</th><td>' + (estudiante.observaciones || '') + '</td></tr>';

        const listaCursos = document.getElementById('lista-cursos');
        if (estudiante.cursos.length === 0) {
            document.getElementById('sin-cursos').hidden = false;
        } else {
            estudiante.cursos.forEach(function (cursoId) {
                const curso = cursos.find(function (c) { return c.id === cursoId; });
                const li = document.createElement('li');
                li.textContent = curso ? curso.nombre : '?';
                listaCursos.appendChild(li);
            });
        }

        const evaluaciones = EduData.getEvaluaciones().filter(function (ev) { return ev.estudianteId === id; });
        if (evaluaciones.length === 0) {
            document.getElementById('sin-evaluaciones').hidden = false;
        } else {
            const tbody = document.querySelector('#tabla-evaluaciones tbody');
            evaluaciones.forEach(function (ev) {
                const curso = cursos.find(function (c) { return c.id === ev.cursoId; });
                const tr = document.createElement('tr');
                tr.innerHTML = '<td>' + (curso ? curso.nombre : '?') + '</td><td>' + ev.nota + '</td><td>' + ev.fecha + '</td><td>' + (ev.comentario || '') + '</td>';
                tbody.appendChild(tr);
            });
        }
    }
</script>
</body>
</html>
